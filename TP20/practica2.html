<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valores de Elementos en JS</title>
    <link rel="stylesheet" href="css/estilo2.css">
</head>
<body>
    <div class="caja" id="saludar">
        <h1>Saludar</h1>
        <input type="text" placeholder="Ingrese su nombre">
        <span>
            <button>Saludar</button>
            <div id="respuesta">...respuesta</div>
        </span>
    </div>

    <div class="caja" id="ingredientes">
        <h1>Calculadora de ingredientes</h1>
        <ul>
            <li>500grms de papa</li>
            <li>100ml de leche</li>
            <li>30grms de manteca</li>
            <li>1 huevo</li>
        </ul>
        <input type="text" placeholder="cantidad de comensales">
        <span>
            <button>Calcular</button>
        </span>
    </div>
    <div class="caja" id="asistencia">
        <h1>Lista de asistencia</h1>
        <input type="text" placeholder="Ingresar nombre">
        <span>
            <button id="btnAgregar">Agregar</button>
            <button id="btnVer">Ver</button>
            <div id="respuesta">...respuesta</div>
        </span>
    </div>
    <script src="script/script2.js"></script>
</body>
</html>
