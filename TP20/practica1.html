<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar estilo</title>
    <link rel="stylesheet" href="css/estilo1.css">
</head>
<body>
    <h1>Modificar estilo</h1>
    <h2>Distribucion</h2>
    <div id="distribucion">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div>
        <button id="btnVertical">Vertical</button>
        <button id="btnHorizontal">Horizontal</button>
    </div>
    <h2>Colores</h2>
    <div class="caja" id="cajaColor">
        <div>Cambiar color de fondo</div>
        <div>
            <button data-color="red">Rojo</button>
            <button data-color="green">Verde</button>
            <button data-color="blue">Azul</button>
        </div>
    </div>
    <h2>Tamaño de texto</h2>
    <div class="caja" id="tamanioTexto">
        <div id="texto">Cambiar color y tamaño de texto</div>
        <div>
            <button id="btnPequenio">Pequeño</button>
            <button id="btnGrande">Grande</button>
            <input type="color" id="selectColor">
        </div>
    </div>
    <div class="caja">
        <div id="toggle">Ocultar y mostrar</div>
        <div>
            <button id="btnOcultar">Ocultar</button>
            <button id="btnMostrar">Mostrar</button>
        </div>
    </div>

    <script src="script/script1.js"></script>
</body>
</html>
