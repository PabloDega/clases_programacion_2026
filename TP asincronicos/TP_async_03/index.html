<!DOCTYPE html>
<html>
<head>
    <title>Perfil de Jugador</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
    <h1>Player Profile</h1>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Ranking</a>
        <a href="#">Logros</a>
    </nav>
</header>

<main>

    <!-- PERFIL -->
    <section id="perfil">

        <div class="card destacado">
            <h2>Jugador: ShadowX</h2>
            <p class="nivel">Nivel 42</p>
            <p>Especialista en estrategia y combate táctico.</p>
        </div>

    </section>

    <!-- ESTADÍSTICAS -->
    <section id="estadisticas">

        <div class="stats">

            <div class="stat">
                <p>Partidas</p>
                <p>120</p>
            </div>

            <div class="stat">
                <p>Victorias</p>
                <p>85</p>
            </div>

            <div class="stat">
                <p>Derrotas</p>
                <p>35</p>
            </div>

        </div>

    </section>

    <!-- LOGROS -->
    <section id="logros">

        <h2>Logros</h2>

        <div class="lista-logros">

            <div class="logro">
                <p>🏆 Campeón</p>
            </div>

            <div class="logro">
                <p>🔥 Racha 10 victorias</p>
            </div>

            <div class="logro">
                <p>⚡ Velocidad máxima</p>
            </div>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 Gamer Stats</p>
</footer>

</body>
</html>
