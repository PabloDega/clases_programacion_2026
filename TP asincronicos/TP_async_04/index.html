<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes en HTML</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="contenedor">
        <h1>Imagen JPG</h1>
        <img src="im/foto01.jpg" alt="Imagen en JPG">
        <h1>Gif animado</h1>
        <img src="im/loading.gif" alt="Gif animado">
        <h1>Imagen PNG</h1>
        <img src="im/CFL 2022 V3.png" alt="Imagen PNG">
        <h1>Imagen SVG</h1>
        <img src="im/blackcat.svg" alt="Imagen SVG">
    </div>
    <div class="contenedor" id="filtros">
        <h1>Filtro de imagenes</h1>
        <img src="im/foto01.jpg" alt="Foto de ejemplo" id="filtro1">
        <img src="im/foto01.jpg" alt="Foto de ejemplo" id="filtro2">
        <img src="im/foto01.jpg" alt="Foto de ejemplo" id="filtro3">
        <img src="im/foto01.jpg" alt="Foto de ejemplo" id="filtro4">
        <img src="im/foto01.jpg" alt="Foto de ejemplo" id="filtro5">
    </div>
    <div class="contenedor" id="galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
        <img src="im/perro.png" alt="Imagen de galeria">
    </div>
</body>
</html>
